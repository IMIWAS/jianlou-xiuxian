<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 捡漏修仙系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body{
  min-height:100vh;
  font-family:"Microsoft YaHei","SimHei",sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,215,0,.25), transparent 55%),
    linear-gradient(160deg,#8b0000 0%,#b3001b 40%,#5c0000 100%);
  display:flex; align-items:center; justify-content:center;
  padding:20px 12px;
}
.box{ width:100%; max-width:400px; }
.banner{
  text-align:center; font-size:13px; letter-spacing:2px; color:#ffd700;
  border:2px dashed #ffd700; border-radius:6px; padding:6px; margin-bottom:10px;
  animation:borderFlash 1s steps(2) infinite; background:rgba(0,0,0,.25);
}
@keyframes borderFlash{ 50%{ border-color:#ff4500; color:#ffec80; } }
h1{
  text-align:center; font-size:36px; font-weight:900; letter-spacing:4px; margin:6px 0 14px;
  background:linear-gradient(180deg,#fff7c0,#ffd700 35%,#b8860b 55%,#ffec8b 70%,#ffd700);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 0 #7a4d00) drop-shadow(0 0 12px rgba(255,215,0,.8));
}
.card{
  background:linear-gradient(180deg,#fffbe6,#ffe9a8); color:#7a1f00;
  border:3px solid #ffd700; border-radius:12px;
  box-shadow:0 0 0 3px #8b0000,0 8px 20px rgba(0,0,0,.45);
  padding:20px 18px;
}
.card h2{
  font-size:18px; color:#b3001b; text-align:center; margin-bottom:14px;
  text-shadow:1px 1px 0 #fff;
}
label{ display:block; font-size:13px; font-weight:bold; margin:10px 0 4px; }
input{
  width:100%; font-size:15px; padding:10px;
  border:3px inset #d4a017; border-radius:6px; background:#fffbe6; color:#7a1f00;
  outline:none;
}
.hint{ font-size:11px; color:#8a5a00; margin-top:2px; }
.err{
  min-height:20px; font-size:13px; color:#c40000; font-weight:bold;
  text-align:center; margin:8px 0 2px;
}
.bigbtn{
  display:block; width:100%; font-size:20px; font-weight:900; letter-spacing:4px; color:#7a1f00;
  background:linear-gradient(180deg,#fff3b0,#ffd700 45%,#ff9d00);
  border:4px ridge #ffd700; border-radius:12px; padding:13px; cursor:pointer;
  box-shadow:0 5px 0 #8b5a00;
}
.bigbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #8b5a00; }
.links{ text-align:center; font-size:13px; margin-top:12px; color:#7a5a10; }
.links a{ color:#b3001b; font-weight:bold; text-decoration:underline; cursor:pointer; }
.footer{ text-align:center; font-size:11px; color:#ffca7a; margin-top:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="banner">★ 民间捡漏协会 · 会员登记处 ★</div>
  <h1>捡漏修仙系统</h1>
  <div class="card">
    <h2>📝 新道友登记 📝</h2>
    <label>手机号</label>
    <input type="tel" id="phone" maxlength="11" placeholder="11 位手机号">
    <label>道号（昵称，可不填）</label>
    <input type="text" id="nickname" maxlength="12" placeholder="不填则封为「漏友XXXX」">
    <label>密码</label>
    <input type="password" id="password" placeholder="至少 6 位">
    <label>确认密码</label>
    <input type="password" id="password2" placeholder="再输一遍，防止手抖">
    <div class="hint">注册即代表你发誓：不为凑单买东西，不被假折扣骗。</div>
    <div class="err" id="err"></div>
    <button class="bigbtn" id="regBtn">注册并入门</button>
    <div class="links">已有账号？<a href="/login.html">直接登录</a></div>
  </div>
  <div class="footer">⚠ 本系统特效经费仅剩五毛 ⚠</div>
</div>

<script>
if(localStorage.getItem('jl_token')) location.href = '/';

const err = m => document.getElementById('err').textContent = m;

document.getElementById('regBtn').onclick = async () => {
  err('');
  const phone = document.getElementById('phone').value.trim();
  const nickname = document.getElementById('nickname').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if(!/^1[3-9]\d{9}$/.test(phone)) return err('手机号格式不对，道友再瞧瞧');
  if(password.length < 6) return err('密码至少 6 位');
  if(password !== password2) return err('两遍密码不一样，手抖了？');
  try{
    const res = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({phone, password, nickname})
    });
    const data = await res.json();
    if(!res.ok) return err(data.error || '注册失败');
    localStorage.setItem('jl_token', data.token);
    localStorage.setItem('jl_user', JSON.stringify(data.user));
    location.href = '/';
  }catch(e){ err('连不上服务器，服务器起了吗？'); }
};
document.getElementById('password2').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('regBtn').click();
});
</script>
</body>
</html>
